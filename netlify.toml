# The deployable site is the Vite/Preact app in web/.
# dogd/ (Rust) is a local daemon and is not built or deployed by Netlify.
[build]
  base = "web"
  command = "npm ci --include=dev && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Security headers. Everything is served from this site; the only other
# place the interface talks to is dogd, on this machine (docs/SECURITY.md).
# blob: images and camera=(self): Camera Sniffer's inspection photos, taken
# here and kept in this browser.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' http://127.0.0.1:4782 ws://127.0.0.1:4782; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "serial=(self), camera=(self), microphone=(), geolocation=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

# The dogd installer: curl --proto '=https' --tlsv1.2 -fsSL https://hardwaredog.org/install | bash
[[headers]]
  for = "/install"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "no-cache"

# The service worker is checked on every visit: a new version is found as
# soon as it is deployed (it then waits for the person, docs/WEB_APP.md).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Hashed build files never change under the same name.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "no-cache"

