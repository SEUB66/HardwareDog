name: dogd

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'dogd/**'
      - 'web/**'
      - 'cases/**'
      - 'packaging/**'
      - '.github/workflows/dogd.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: format
        working-directory: dogd
        run: cargo fmt --check
      - name: lint
        working-directory: dogd
        run: cargo clippy --all-targets -- -D warnings
      - name: unit tests
        working-directory: dogd
        run: cargo test
      - name: build
        working-directory: dogd
        run: cargo build
      # LVL 100: the same sources and lockfile give the same binary, wherever it is built.
      - name: release built twice, compared byte for byte
        working-directory: dogd
        run: |
          CARGO_TARGET_DIR=/tmp/r1 cargo build --release --locked
          CARGO_TARGET_DIR=/tmp/r2 cargo build --release --locked
          cmp /tmp/r1/release/dogd /tmp/r2/release/dogd
          sha256sum /tmp/r1/release/dogd
      # The package a release publishes: built, installed, started, removed.
      - name: the .deb installs and starts
        run: |
          packaging/deb/build-deb.sh /tmp/r1/release/dogd amd64
          sudo apt-get install -y ./dist/hwdog-dogd_*_amd64.deb
          dogd serve --source host --listen 127.0.0.1:4799 --data "$RUNNER_TEMP/d" &
          pid=$!
          for i in $(seq 1 50); do curl -fs http://127.0.0.1:4799/v1/health && break; sleep 0.2; done
          curl -fs http://127.0.0.1:4799/v1/health | grep -q '"status":"ok"'
          kill "$pid"
          sudo apt-get remove -y hwdog-dogd
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install interface
        working-directory: web
        run: npm ci
      # LVL 55 gate: the interface through a real dogd == the interface direct.
      - name: dogd is transparent
        working-directory: web
        run: DOGD_BIN="$GITHUB_WORKSPACE/dogd/target/debug/dogd" npx vitest run test/dogd.test.ts

  # Identity on the other desks: the USB location comes from the OS there
  # (Windows location path, macOS location id), not from sysfs.
  other-os:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The recordings must arrive byte for byte (LF, as sealed).
      - name: evidence is checked out unchanged
        shell: bash
        run: |
          git ls-files --eol cases/baseline/HD-C001.hdlog
          ! grep -q $'\r' cases/*/*.hdlog
      - name: lint
        working-directory: dogd
        run: cargo clippy --all-targets -- -D warnings
      - name: unit tests
        working-directory: dogd
        run: cargo test
