name: web

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'web/**'
      - 'cases/**'
      - 'protocol/**'
      - '.github/workflows/web.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # LVL 50: the cases, replayed by the command line, outside the test suite.
      - run: npm run test:cases
