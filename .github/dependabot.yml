# The actions are pinned by commit; Dependabot proposes the new commit (with
# its tag in the comment) when an action releases, as a reviewed pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The daemon's crates and the interface's packages: a fix for a known
  # vulnerability arrives as a reviewed pull request, tested by CI like any
  # other. Grouped, so a week is one pull request per ecosystem, not twenty.
  - package-ecosystem: cargo
    directory: /dogd
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      crates:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      packages:
        patterns: ['*']
