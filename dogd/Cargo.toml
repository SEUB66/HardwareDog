[package]
name = "dogd"
version = "0.1.0"
edition = "2021"
description = "Hardware Dog local daemon: discovers devices, bridges HDP, stores sessions. Local only."
license-file = "../LICENSE"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
tokio-serial = { version = "5", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[profile.release]
strip = true
lto = "thin"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
