[package]
name = "dogd"
version = "0.1.0"
edition = "2021"
description = "Hardware Dog local daemon: discovers devices, bridges HDP, stores sessions. Local only."
license-file = "../LICENSE"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
tokio-serial = { version = "5", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# The LAN access token: 128 bits from the operating system.
getrandom = "0.3"

# Bluetooth LE discovery through BlueZ, over the system D-Bus, in pure
# Rust (no libdbus): the Bluetooth Lab scanner. Linux only; elsewhere the
# scanner says it is not supported.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }

# USB location (topology) and interface number from the OS: the Windows
# location path, the macOS location id. Linux reads sysfs itself
# (identity::usb_topology), so the feature stays off there.
[target.'cfg(not(target_os = "linux"))'.dependencies]
serialport = { version = "4.10", default-features = false, features = ["usbportinfo-location", "usbportinfo-interface"] }

[profile.release]
strip = true
lto = "thin"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
